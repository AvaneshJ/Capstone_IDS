# ==========================================================
# SentinelAI Security Orchestration & Automation Policies
# Configurable rules, risk thresholds, MITRE mappings, and whitelists
# ==========================================================

version: "1.0.0"
policy_name: "SentinelAI_Enterprise_Default"

# Whitelist Configuration (Traffic from these will NEVER be blocked)
whitelists:
  ips:
    - "127.0.0.1"
    - "::1"
    - "192.168.1.1"
    - "10.0.0.1"
    - "8.8.8.8"
    - "1.1.1.1"
  subnets:
    - "192.168.100.0/24"
    - "10.10.0.0/16"

# Base Attack Weights for Risk Calculation (Scale 0.0 to 10.0)
base_attack_weights:
  DDoS: 9.0
  Botnet: 9.0
  Infiltration: 8.5
  DoS: 8.0
  BruteForce: 7.0
  WebAttack: 6.5
  PortScan: 5.0
  AnomalousTraffic: 4.0
  BENIGN: 0.0

# Dynamic Risk Thresholds & Autonomous SOAR Actions
thresholds:
  critical:
    min_score: 8.5
    action: "BLOCK_IP"
    ban_duration_seconds: 86400  # 24 hours (or 0 for permanent)
    priority: 5
    notify_channels: ["DESKTOP", "DASHBOARD", "TELEGRAM", "CONSOLE"]
    generate_llm_briefing: true
    rationale: "Critical threat detected with high confidence/velocity. Immediate autonomous firewall mitigation enforced."

  high:
    min_score: 7.0
    action: "TEMP_BAN_IP"
    ban_duration_seconds: 1800   # 30 minutes
    priority: 4
    notify_channels: ["DESKTOP", "DASHBOARD", "CONSOLE"]
    generate_llm_briefing: true
    rationale: "High severity attack pattern observed. 30-minute quarantine enforced."

  medium:
    min_score: 5.0
    action: "TEMP_BAN_IP"
    ban_duration_seconds: 900    # 15 minutes
    priority: 3
    notify_channels: ["DASHBOARD", "CONSOLE"]
    generate_llm_briefing: false
    rationale: "Moderate risk activity detected. 15-minute temporary containment applied."

  low:
    min_score: 1.0
    action: "LOG_ONLY"
    ban_duration_seconds: 0
    priority: 1
    notify_channels: ["CONSOLE"]
    generate_llm_briefing: false
    rationale: "Low severity observation. Event logged to watchlist without active disruption."

# Frequency / Velocity Multipliers (60-second sliding window per Source IP)
velocity_settings:
  sliding_window_seconds: 60
  tiers:
    - max_count: 3
      multiplier: 0.0
    - max_count: 10
      multiplier: 0.8
    - max_count: 25
      multiplier: 1.6
    - max_count: 1000000
      multiplier: 2.5

# Target Sensitivity Scores (Added to risk score if targeted)
target_sensitivity:
  critical_subnets:
    - "192.168.1.0/24"
  sensitive_ports:
    3306: 1.5   # MySQL Database
    5432: 1.5   # PostgreSQL Database
    1433: 1.5   # MSSQL Database
    22: 1.2     # SSH Remote Access
    3389: 1.5   # Windows Remote Desktop (RDP)
    445: 1.8    # SMB / Active Directory
    80: 0.5     # HTTP Web Server
    443: 0.5    # HTTPS Web Server
    8080: 0.6   # App Server

# MITRE ATT&CK Framework Mapping
mitre_mappings:
  PortScan:
    technique_id: "T1046"
    technique_name: "Network Service Discovery"
    tactic: "Discovery"
    description: "Adversary attempting to enumerate open ports and services across hosts."
  DDoS:
    technique_id: "T1498"
    technique_name: "Network Denial of Service"
    tactic: "Impact"
    description: "Adversary overwhelming network bandwidth to disrupt service availability."
  DoS:
    technique_id: "T1499"
    technique_name: "Endpoint Denial of Service"
    tactic: "Impact"
    description: "Adversary exhausting host computational resources."
  BruteForce:
    technique_id: "T1110"
    technique_name: "Brute Force"
    tactic: "Credential Access"
    description: "Adversary attempting repeated authentication attempts to guess credentials."
  Botnet:
    technique_id: "T1071"
    technique_name: "Standard Application Layer Protocol"
    tactic: "Command and Control"
    description: "Infected host communicating with external C2 infrastructure."
  Infiltration:
    technique_id: "T1190"
    technique_name: "Exploit Public-Facing Application"
    tactic: "Initial Access"
    description: "Adversary exploiting vulnerable edge software to gain unauthorized access."
  BENIGN:
    technique_id: "T0000"
    technique_name: "Authorized Baseline Traffic"
    tactic: "Legitimate"
    description: "Normal authorized communications."
